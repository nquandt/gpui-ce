[package]
name = "ios_counter"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "ios_counter"
crate-type = ["staticlib"]

[dependencies]
gpui = { path = "../../crates/gpui/", package = "gpui-ce" }
gpui_mobile = { path = "../../crates/gpui_mobile/", default-features = false, features = [
  "video_player",
  "camera",
] }
log.workspace = true
